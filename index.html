<!-- vCard Download Script -->
<script>
  function downloadVCard() {
    const vcardData = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:Mart;Zorian;;;',
      'FN:Zorian Mart',
      'TITLE:Product Management',
      'EMAIL;TYPE=INTERNET,HOME:zoryan2006@gmail.com',
      'TEL;TYPE=CELL:+380960227519',
      'ADR;TYPE=HOME:;;Kyiv / England;;;;',
      'URL:https://www.linkedin.com/in/zorian-mart-440b88333/',
      'NOTE:Telegram: @nechipp | GitHub: Zoryanchik',
      'END:VCARD'
    ].join('\r\n');

    const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.setAttribute('download', 'Zorian_Mart.vcf');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }
</script>
