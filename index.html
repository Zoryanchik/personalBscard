    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg:            #09090b;
        --surface:       rgba(255,255,255,0.04);
        --surface-hover: rgba(255,255,255,0.07);
        --border:        rgba(255,255,255,0.08);
        --border-bright: rgba(255,255,255,0.14);
        --text-primary:  #f4f4f5;
        --text-secondary:#a1a1aa;
        --text-muted:    #52525b;
        --accent-green:  #22c55e;
        --accent-blue:   #3b82f6;
        --accent-sky:    #38bdf8;
        --accent-amber:  #f59e0b;
        --accent-purple: #a78bfa;
        --radius-card:   24px;
        --radius-tile:   16px;
        --radius-sm:     10px;
        --font: 'Inter', system-ui, -apple-system, sans-serif;
      }

      html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text-primary);
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-x: hidden;
        position: relative;
      }

      /* ── Ambient Background ── */
      .bg-scene {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }

      .bg-scene::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, rgba(255,255,255,0.055) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 100%);
      }

      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.35;
        animation: orbFloat 12s ease-in-out infinite;
      }
      .orb-1 { width:500px; height:500px; background:radial-gradient(circle, #7c3aed, transparent 70%); top:-150px; left:-100px; animation-delay:0s; }
      .orb-2 { width:400px; height:400px; background:radial-gradient(circle, #2563eb, transparent 70%); bottom:-100px; right:-80px; animation-delay:-6s; }
      .orb-3 { width:300px; height:300px; background:radial-gradient(circle, #0891b2, transparent 70%); top:40%; right:10%; animation-delay:-3s; opacity:0.2; }

      @keyframes orbFloat {
        0%,100% { transform: translateY(0) scale(1); }
        50%      { transform: translateY(-30px) scale(1.05); }
      }

      /* ── Card ── */
      .card-wrap { position:relative; z-index:10; width:100%; max-width:420px; }

      .card {
        background: rgba(12,10,14,0.75);
        backdrop-filter: blur(32px) saturate(180%);
        -webkit-backdrop-filter: blur(32px) saturate(180%);
        border: 1px solid var(--border-bright);
        border-radius: var(--radius-card);
        padding: 28px 24px 24px;
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.03),
          0 8px 32px rgba(0,0,0,0.6),
          0 32px 64px rgba(0,0,0,0.4),
          inset 0 1px 0 rgba(255,255,255,0.08);
        display: flex;
        flex-direction: column;
        gap: 20px;
        animation: cardIn 0.6s cubic-bezier(0.16,1,0.3,1) both;
      }

      @keyframes cardIn {
        from { opacity:0; transform:translateY(20px) scale(0.98); }
        to   { opacity:1; transform:translateY(0) scale(1); }
      }

      /* ── Header ── */
      .profile-header { display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; }

      .avatar-wrap { position:relative; width:88px; height:88px; flex-shrink:0; }
      .avatar-ring {
        position:absolute; inset:-3px; border-radius:50%;
        background: conic-gradient(from 0deg, #7c3aed, #3b82f6, #22c55e, #7c3aed);
        animation: ringRotate 4s linear infinite;
        filter: blur(0.5px);
      }
      @keyframes ringRotate { to { transform:rotate(360deg); } }

      .avatar-inner { position:relative; z-index:1; width:88px; height:88px; border-radius:50%; background:#18181b; padding:3px; }
      .avatar-img { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }

      .status-badge {
        position:absolute; bottom:2px; right:2px; z-index:2;
        width:20px; height:20px; border-radius:50%;
        background:#22c55e; border:3px solid #09090b;
        box-shadow:0 0 8px rgba(34,197,94,0.6);
        animation: statusPulse 2.5s ease-in-out infinite;
      }
      @keyframes statusPulse {
        0%,100% { box-shadow:0 0 8px rgba(34,197,94,0.6); }
        50%      { box-shadow:0 0 16px rgba(34,197,94,0.9),0 0 32px rgba(34,197,94,0.3); }
      }

      .profile-name {
        font-size:26px; font-weight:800; letter-spacing:-0.6px; line-height:1.1;
        background: linear-gradient(135deg,#f4f4f5 30%,#a1a1aa 100%);
        -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      }
      .profile-title { font-size:13px; font-weight:500; color:var(--text-secondary); letter-spacing:0.3px; }

      .status-pill {
        display:inline-flex; align-items:center; gap:7px;
        background:rgba(34,197,94,0.08); border:1px solid rgba(34,197,94,0.2);
        border-radius:100px; padding:5px 12px;
        font-size:11.5px; font-weight:500; color:#86efac; letter-spacing:0.2px;
      }
      .status-dot { width:6px; height:6px; border-radius:50%; background:#22c55e; animation:dotPulse 2s ease-in-out infinite; flex-shrink:0; }
      @keyframes dotPulse {
        0%,100% { opacity:1; transform:scale(1); }
        50%      { opacity:0.5; transform:scale(0.8); }
      }

      .location-tag { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--text-muted); margin-top:-4px; }

      /* ── Divider ── */
      .divider { height:1px; background:linear-gradient(90deg,transparent,var(--border-bright),transparent); flex-shrink:0; }

      /* ── Buttons ── */
      .cta-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

      .btn {
        display:inline-flex; align-items:center; justify-content:center; gap:7px;
        min-height:48px; border-radius:var(--radius-sm);
        font-family:var(--font); font-size:13.5px; font-weight:600; letter-spacing:0.1px;
        text-decoration:none; cursor:pointer; border:none;
        transition:transform 0.15s ease,box-shadow 0.15s ease,background 0.15s ease;
        position:relative; overflow:hidden; -webkit-tap-highlight-color:transparent;
      }
      .btn::after {
        content:''; position:absolute; inset:0;
        background:linear-gradient(135deg,rgba(255,255,255,0.12) 0%,transparent 60%);
        pointer-events:none; border-radius:inherit;
      }
      .btn:hover { transform:translateY(-1px); }
      .btn:active { transform:scale(0.97); }

      .btn-primary {
        background:linear-gradient(135deg,#7c3aed,#6d28d9); color:#fff;
        box-shadow:0 4px 14px rgba(109,40,217,0.45),0 1px 3px rgba(0,0,0,0.3);
      }
      .btn-primary:hover {
        background:linear-gradient(135deg,#8b5cf6,#7c3aed);
        box-shadow:0 6px 20px rgba(109,40,217,0.6),0 1px 3px rgba(0,0,0,0.3);
      }

      .btn-secondary {
        background:rgba(56,189,248,0.1); border:1px solid rgba(56,189,248,0.22);
        color:var(--accent-sky); box-shadow:0 2px 8px rgba(0,0,0,0.2);
      }
      .btn-secondary:hover {
        background:rgba(56,189,248,0.16); border-color:rgba(56,189,248,0.4);
        box-shadow:0 4px 16px rgba(56,189,248,0.2);
      }

      /* ── Contact row ── */
      .contact-row { display:flex; flex-direction:column; gap:6px; }

      .contact-item {
        display:flex; align-items:center; gap:10px;
        padding:10px 12px; border-radius:var(--radius-sm);
        background:var(--surface); border:1px solid var(--border);
        cursor:pointer;
        transition:background 0.15s,border-color 0.15s,transform 0.15s;
        -webkit-tap-highlight-color:transparent; user-select:none;
        font-family:var(--font); width:100%;
      }
      .contact-item:hover { background:var(--surface-hover); border-color:var(--border-bright); transform:translateX(2px); }
      .contact-item:active { transform:scale(0.98); }

      .contact-icon { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
      .contact-icon-email { background:rgba(168,85,247,0.15); color:var(--accent-purple); }
      .contact-icon-phone { background:rgba(34,197,94,0.12); color:#4ade80; }
      .contact-text { display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
      .contact-label { font-size:12px; color:var(--text-muted); font-weight:500; }
      .contact-value { font-size:13px; color:var(--text-primary); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .copy-hint { font-size:10.5px; color:var(--text-muted); flex-shrink:0; opacity:0; transition:opacity 0.2s; }
      .contact-item:hover .copy-hint { opacity:1; }

      /* ── Bento grid ── */
      .bento-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

      .bento-tile {
        display:flex; flex-direction:column; gap:10px;
        padding:14px; border-radius:var(--radius-tile);
        background:var(--surface); border:1px solid var(--border);
        text-decoration:none; color:inherit;
        transition:background 0.2s,border-color 0.2s,transform 0.2s,box-shadow 0.2s;
        cursor:pointer; position:relative; overflow:hidden;
        -webkit-tap-highlight-color:transparent; min-height:90px;
      }
      .bento-tile::before { content:''; position:absolute; inset:0; opacity:0; transition:opacity 0.2s; border-radius:inherit; }
      .bento-tile:hover { transform:translateY(-2px); }
      .bento-tile:active { transform:scale(0.97); }

      .tile-telegram { color:var(--accent-sky); }
      .tile-telegram::before { background:radial-gradient(circle at 0% 0%,rgba(56,189,248,0.12),transparent 60%); }
      .tile-telegram:hover { background:rgba(56,189,248,0.07); border-color:rgba(56,189,248,0.25); box-shadow:0 0 20px rgba(56,189,248,0.1); }
      .tile-telegram:hover::before { opacity:1; }

      .tile-linkedin { color:#60a5fa; }
      .tile-linkedin::before { background:radial-gradient(circle at 0% 0%,rgba(59,130,246,0.12),transparent 60%); }
      .tile-linkedin:hover { background:rgba(59,130,246,0.07); border-color:rgba(59,130,246,0.25); box-shadow:0 0 20px rgba(59,130,246,0.1); }
      .tile-linkedin:hover::before { opacity:1; }

      .tile-github { color:#e4e4e7; }
      .tile-github::before { background:radial-gradient(circle at 0% 0%,rgba(228,228,231,0.08),transparent 60%); }
      .tile-github:hover { background:rgba(228,228,231,0.05); border-color:rgba(228,228,231,0.2); box-shadow:0 0 20px rgba(255,255,255,0.05); }
      .tile-github:hover::before { opacity:1; }

      .tile-portfolio {
        grid-column:1 / -1; flex-direction:row; align-items:center; gap:14px;
        color:var(--accent-amber); min-height:72px;
        background:linear-gradient(135deg,rgba(245,158,11,0.06),rgba(251,191,36,0.03));
        border-color:rgba(245,158,11,0.2);
      }
      .tile-portfolio::before { background:radial-gradient(circle at 0% 50%,rgba(245,158,11,0.15),transparent 60%); }
      .tile-portfolio:hover {
        background:linear-gradient(135deg,rgba(245,158,11,0.1),rgba(251,191,36,0.06));
        border-color:rgba(245,158,11,0.35); box-shadow:0 0 24px rgba(245,158,11,0.12);
        transform:translateY(-2px);
      }
      .tile-portfolio:hover::before { opacity:1; }

      .tile-icon { width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:9px; background:rgba(255,255,255,0.06); flex-shrink:0; }
      .tile-name { font-size:13px; font-weight:600; color:var(--text-primary); line-height:1.2; }
      .tile-handle { font-size:11px; color:var(--text-muted); font-weight:400; }
      .tile-text { display:flex; flex-direction:column; gap:2px; }

      .tile-arrow { margin-left:auto; color:var(--text-muted); transition:transform 0.2s,color 0.2s; flex-shrink:0; }
      .bento-tile:hover .tile-arrow { transform:translateX(3px); color:inherit; }

      .tile-portfolio .tile-arrow { animation:arrowBounce 1.6s ease-in-out infinite; }
      @keyframes arrowBounce {
        0%,100% { transform:translateX(0); }
        50%      { transform:translateX(4px); }
      }
      .tile-portfolio:hover .tile-arrow { animation:none; transform:translateX(5px); }

      .pdf-badge {
        display:inline-flex; align-items:center; gap:4px;
        background:rgba(245,158,11,0.15); border:1px solid rgba(245,158,11,0.3);
        border-radius:6px; padding:2px 8px;
        font-size:10px; font-weight:700; color:var(--accent-amber); letter-spacing:0.5px;
        margin-top:2px; width:fit-content;
      }

      /* ── Footer ── */
      .card-footer { text-align:center; font-size:11px; color:var(--text-muted); letter-spacing:0.3px; }

      /* ── Toast ── */
      .toast {
        position:fixed; bottom:32px; left:50%;
        transform:translateX(-50%) translateY(16px);
        background:rgba(24,24,27,0.95);
        backdrop-filter:blur(20px);
        border:1px solid rgba(255,255,255,0.12);
        border-radius:100px; padding:10px 18px;
        font-size:13px; font-weight:500; color:var(--text-primary);
        display:flex; align-items:center; gap:8px;
        z-index:9999; box-shadow:0 8px 32px rgba(0,0,0,0.5);
        opacity:0; transition:opacity 0.25s,transform 0.25s;
        pointer-events:none; white-space:nowrap;
        font-family:var(--font);
      }
      .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

      /* ── Responsive ── */
      @media (max-width:400px) {
        body { padding:12px; }
        .card { padding:22px 18px 20px; }
        .btn { font-size:13px; min-height:46px; }
      }
      @media (min-width:640px) {
        .card-wrap { max-width:440px; }
        .card { padding:32px 28px 28px; }
      }
    </style>
  </head>

          'URL:https://www.linkedin.com/in/zorian-mart-440b88333/',
          'NOTE:Telegram: @nechipp | GitHub: Zoryanchik','END:VCARD'
        ].join('\r\n');
        const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8;' });
        const url  = URL.createObjectURL(blob);
        const a    = Object.assign(document.createElement('a'), { href: url, download: 'Zorian_Mart.vcf' });
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('✓', 'Contact saved!');
      }

      function copyToClipboard(text, msg) {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(() => showToast('✓', msg));
        } else {
          const ta = Object.assign(document.createElement('textarea'), { value: text });
          ta.style.cssText = 'position:fixed;opacity:0';
          document.body.appendChild(ta); ta.focus(); ta.select();
          try { document.execCommand('copy'); showToast('✓', msg); } catch(_){}
          document.body.removeChild(ta);
        }
      }

      let toastTimer = null;
      function showToast(icon, msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toast-icon').textContent = icon;
        document.getElementById('toast-msg').textContent  = msg;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
      }
    </script>
